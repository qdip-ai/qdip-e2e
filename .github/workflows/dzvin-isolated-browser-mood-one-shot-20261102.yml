name: Dzvin isolated real browser mood QA
on:
  push:
    branches: [test/dzvin-railway-browser-mood-20261102]
permissions:
  contents: read
jobs:
  browser-mood:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      DZVIN_RAILWAY_MOOD_BROWSER_ACK: '1'
      QDIP_E2E_ZITADEL_TEST1_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_LOGIN }}
      QDIP_E2E_ZITADEL_TEST1_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD }}
      QDIP_E2E_ZITADEL_TEST2_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_LOGIN }}
      QDIP_E2E_ZITADEL_TEST2_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/dzvin_railway_isolated_browser_mood_20261102.mjs
      - name: Install isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dzvin-isolated-browser"
          cp scripts/dzvin_railway_isolated_browser_mood_20261102.mjs "$RUNNER_TEMP/dzvin-isolated-browser/"
          cd "$RUNNER_TEMP/dzvin-isolated-browser"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Real browser mood form save and history across viewports
        run: cd "$RUNNER_TEMP/dzvin-isolated-browser" && node dzvin_railway_isolated_browser_mood_20261102.mjs
