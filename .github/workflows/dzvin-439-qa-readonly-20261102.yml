name: Dzvin 439 QA1 QA2 browser verification 2026-11-02
# Ephemeral branch-only authenticated QA; no user-data writes or secret artifacts.
on:
  push:
    branches:
      - test/dzvin-439-qa-readonly-20261102
permissions:
  contents: read
concurrency:
  group: dzvin-439-qa-readonly-20261102
  cancel-in-progress: false
jobs:
  qa1-qa2-preview:
    if: github.repository == 'qdip-ai/qdip-e2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      DZVIN_QA_READONLY_ACK: '1'
      DZVIN_PREVIEW_ORIGIN: https://mentality-ackqqrqn2-taras-gezs-projects.vercel.app
      DZVIN_EXPECTED_PREVIEW_ORIGIN: https://mentality-ackqqrqn2-taras-gezs-projects.vercel.app
      DZVIN_PREVIEW_DEPLOYMENT: dpl_6LA11pxMr3TLQ97TZMdgJftY9q9T
      DZVIN_PREVIEW_SHA: 35a923364d370cc9e11c64ae2a53175c043dfc31
      DZVIN_QA_EXPIRED_SESSION_ACK: '1'
      QDIP_E2E_ZITADEL_TEST1_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_LOGIN }}
      QDIP_E2E_ZITADEL_TEST1_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD }}
      QDIP_E2E_ZITADEL_TEST2_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_LOGIN }}
      QDIP_E2E_ZITADEL_TEST2_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_PASSWORD }}
    steps:
      - name: Checkout independent QA
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate test source
        run: node --check scripts/dzvin_qa_current_preview_readonly_20261019.mjs
      - name: Install isolated Playwright browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dzvin-439-qa
          cp scripts/dzvin_qa_current_preview_readonly_20261019.mjs /tmp/dzvin-439-qa/
          cd /tmp/dzvin-439-qa
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Run real PKCE, BFF, tenant read and 2-tab refresh
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/dzvin-439-qa
          node dzvin_qa_current_preview_readonly_20261019.mjs
