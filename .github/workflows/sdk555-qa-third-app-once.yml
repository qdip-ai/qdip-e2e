name: SDK555 one-shot third QA OIDC app fixture (existing Zitadel QA org)
on:
  push:
    branches: [test/sdk649-qa-application-vars-20261104]
    paths:
      - scripts/sdk555_qa_third_app_once.mjs
      - .github/workflows/sdk555-qa-third-app-once.yml
permissions:
  contents: read
concurrency:
  group: sdk555-qa-third-oidc-once
  cancel-in-progress: false
jobs:
  exact-qa-owner-third-app:
    if: github.event_name == 'push' && github.ref == 'refs/heads/test/sdk649-qa-application-vars-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require existing sealed QA21 account and app variables
        env:
          QA21_SECRET_PRESENT: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_PASSWORD != '' }}
          QA_PROJECT_PRESENT: ${{ vars.QDIP_SDK_QA_PROJECT_ID != '' }}
          QA_MANAGED_PRESENT: ${{ vars.QDIP_SDK_MANAGED_APP_ID != '' }}
        run: |
          set -euo pipefail
          test "$QA21_SECRET_PRESENT" = true
          test "$QA_PROJECT_PRESENT" = true
          test "$QA_MANAGED_PRESENT" = true
          node --check scripts/sdk555_qa_third_app_once.mjs
      - name: Install isolated Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p /tmp/sdk555-third-app
          cp scripts/sdk555_qa_third_app_once.mjs /tmp/sdk555-third-app/
          cd /tmp/sdk555-third-app
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Create or verify exact staging-only unrelated OIDC application
        env:
          CI: 'true'
          QDIP_E2E_ZITADEL_TEST21_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_LOGIN }}
          QDIP_E2E_ZITADEL_TEST21_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_PASSWORD }}
          QDIP_SDK_QA_PROJECT_ID: ${{ vars.QDIP_SDK_QA_PROJECT_ID }}
          QDIP_SDK_MANAGED_APP_ID: ${{ vars.QDIP_SDK_MANAGED_APP_ID }}
        run: |
          set -euo pipefail
          cd /tmp/sdk555-third-app
          node sdk555_qa_third_app_once.mjs
