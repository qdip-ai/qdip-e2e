name: Dzvin QA1 QA2 diary ownership E2E (existing Render backend)

# Manual trigger and one-shot push trigger for the pinned new frontend preview. Prior failed-run residue was verified absent, and prior run's own teardown passed.
on:
  workflow_dispatch:
  push:
    branches:
      - qa/dzvin-e2e-receipt-20261019

permissions:
  contents: read

concurrency:
  group: dzvin-diary-scoped-qa1-qa2
  cancel-in-progress: false

jobs:
  scoped-diary-e2e:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      teardown: ${{ steps.diary_run.outputs.teardown }}
    env:
      CI: 'true'
      RUN_RELEASE_QUALIFICATION: '1'
      RUN_B2C_DIARY_E2E: '1'
      DZVIN_QA_MUTATION_RUN_ACK: '1'
      E2E_BASE_URL: https://mentality-f0lbd28o7-taras-gezs-projects.vercel.app
      E2E_ALLOWED_MUTATION_ORIGIN: https://mentality-f0lbd28o7-taras-gezs-projects.vercel.app
      E2E_QA_SHARED_BACKEND_SCOPED_APPROVED: '1'
      E2E_DISPOSABLE_TENANT_CONFIRMED: '0'
      E2E_DEPLOYED_WEB_SHA: 6622a7b213cc6f47c72380c544c02e0c80d0aa65
      E2E_DEPLOYED_BACKEND_SHA: 9367147682caa5c8226519da38403c4b020fb4eb
      QDIP_E2E_ZITADEL_TEST1_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_LOGIN }}
      QDIP_E2E_ZITADEL_TEST1_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD }}
      QDIP_E2E_ZITADEL_TEST2_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_LOGIN }}
      QDIP_E2E_ZITADEL_TEST2_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_PASSWORD }}
    steps:
      - name: Checkout QA authentication runner (no credentials persisted)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned diary E2E suite
        uses: actions/checkout@v4
        with:
          repository: mentality-prj/mentality-tests
          ref: fe74fbf2cc1de43fc2fa2f555d8e7f78e1afcbbf
          path: diary-suite
          persist-credentials: false
      - name: Node 22 and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.26.0'
      - name: Check script syntax and install only the pinned test-suite dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/dzvin_qa_diary_mutation_auth_20261019.mjs
          cd diary-suite
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Authenticate QA1 QA2 and execute exact-fixture diary E2E with teardown
        id: diary_run
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/dzvin_qa_diary_mutation_auth_20261019.mjs diary-suite/.qa-diaries-auth.mjs
          cd diary-suite
          umask 077
          node .qa-diaries-auth.mjs
          set -a
          source playwright/.auth/qa-approval.env
          set +a
          node scripts/b2c-diary-preflight.mjs
          set +e
          pnpm exec playwright test --project=b2c-diary-privacy-chromium --reporter=list --retries=0 --workers=1 2>&1 | tee /tmp/dzvin-diary-e2e.log
          test_result=${PIPESTATUS[0]}
          set -e
          if grep -qx 'DZVIN_RUN_SCOPED_DIARY_FIXTURE_TEARDOWN=PASS' /tmp/dzvin-diary-e2e.log; then
            echo 'teardown=pass' >> "$GITHUB_OUTPUT"
          else
            echo 'teardown=unverified' >> "$GITHUB_OUTPUT"
          fi
          rm -f /tmp/dzvin-diary-e2e.log
          exit "$test_result"
      - name: Cleanup ephemeral local browser credentials
        if: always()
        shell: bash
        run: |
          rm -rf diary-suite/playwright/.auth || true

  publish-diary-receipt:
    if: always()
    needs: scoped-diary-e2e
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Record sanitized QA browser E2E result
        uses: actions/github-script@v7
        with:
          script: |
            const result = String('${{ needs.scoped-diary-e2e.result }}');
            const teardown = String('${{ needs.scoped-diary-e2e.outputs.teardown }}') === 'pass' ? 'PASS' : 'UNVERIFIED';
            const accepted = result === 'success' && teardown === 'PASS';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Dzvin QA1/QA2 diary E2E: **${accepted ? 'PASS' : 'NOT PASS'}**`,
              `Run: ${runUrl}`,
              `Runner job: ${result}`,
              `UUID-scoped diary fixture teardown: ${teardown}`,
              'Only exact QA-owned fixtures. No account or diary contents logged in this receipt.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 81,
              body,
            });
