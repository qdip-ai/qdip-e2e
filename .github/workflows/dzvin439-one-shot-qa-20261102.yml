name: Dzvin authenticated mood-read/logout gate 2026-11-02
# One-shot existing QA secrets only, no customer data mutations.
on:
  push:
    branches:
      - test/dzvin439-logout-mood-read-20261102
permissions:
  contents: read
concurrency:
  group: dzvin439-qa-existing-20261102
  cancel-in-progress: false
jobs:
  qa-existing:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      DZVIN_QA_READONLY_ACK: '1'
      DZVIN_QA_EXPIRED_SESSION_ACK: '1'
      DZVIN_PREVIEW_ORIGIN: https://mentality-ackqqrqn2-taras-gezs-projects.vercel.app
      DZVIN_EXPECTED_PREVIEW_ORIGIN: https://mentality-ackqqrqn2-taras-gezs-projects.vercel.app
      DZVIN_PREVIEW_DEPLOYMENT: dpl_6LA11pxMr3TLQ97TZMdgJftY9q9T
      DZVIN_PREVIEW_SHA: 35a923364d370cc9e11c64ae2a53175c043dfc31
      QDIP_E2E_ZITADEL_TEST1_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_LOGIN }}
      QDIP_E2E_ZITADEL_TEST1_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD }}
      QDIP_E2E_ZITADEL_TEST2_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_LOGIN }}
      QDIP_E2E_ZITADEL_TEST2_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact QA script
        run: node --check scripts/dzvin_qa_current_preview_readonly_20261019.mjs
      - name: Install isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dzvin439-qa"
          cp scripts/dzvin_qa_current_preview_readonly_20261019.mjs "$RUNNER_TEMP/dzvin439-qa/"
          cd "$RUNNER_TEMP/dzvin439-qa"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Execute existing-QA browser logout, mood history and expiry race
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dzvin439-qa"
          node dzvin_qa_current_preview_readonly_20261019.mjs
