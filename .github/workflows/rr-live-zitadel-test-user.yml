name: RR real Zitadel existing test-user browser E2E
on:
  # Credential-bearing browser E2E runs only from reviewed public main,
  # never a PR/untrusted branch. Manual dispatch remains available.
  push:
    branches: [main, feat/rr-e2e-01-standalone]
    paths:
      - scripts/rr_live_zitadel_test_user.mjs
      - .github/workflows/rr-live-zitadel-test-user.yml
      - tests/test_rr_real_zitadel_standalone_browser.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  existing-user-login:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: suite
          persist-credentials: false
      - name: Require existing Zitadel test account credential binding
        env:
          TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
          TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TEST_LOGIN" || -z "$TEST_PASSWORD" ]]; then
            echo 'LIVE_ZITADEL_TEST_USER_SECRET_BINDING=MISSING'
            echo 'Existing account identity is not available to this E2E runner; real-user E2E was not executed.'
            exit 2
          fi
          echo 'LIVE_ZITADEL_TEST_USER_SECRET_BINDING=PASS'
      - name: Checkout the deployed-Web source only for Playwright dependencies
        uses: actions/checkout@v4
        with:
          repository: qdip-ai/qdip-web
          ref: dev
          path: web
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
          run_install: false
      - name: Install Chromium and run a single real-account OIDC browser login
        env:
          QDIP_E2E_ZITADEL_TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
          QDIP_E2E_ZITADEL_TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
          CI: 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp suite/scripts/rr_live_zitadel_test_user.mjs web/rr_live_zitadel_test_user.mjs
          cd web
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          node rr_live_zitadel_test_user.mjs
      - name: Explicitly retain the separate negative-real-identity gate
        if: success()
        run: |
          echo 'REAL_WRONG_ORG_ACCOUNT=NOT_TESTED'
          echo 'REAL_ROLELESS_ACCOUNT=NOT_TESTED'
          echo 'NO_PRODUCTION_RR_MUTATION_PERFORMED=TRUE'

  rr-railway-web-bff-smoke:
    # No credentials or writes. Confirms the actual Railway-hosted UI and BFF auth boundary.
    if: github.event.repository.private == false && github.ref == 'refs/heads/feat/rr-e2e-01-standalone'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify Railway Observatory UI is served
        shell: bash
        run: |
          set -euo pipefail
          origin='https://rr-standalone-web-qa-qa.up.railway.app'
          status=$(curl --silent --show-error --location --max-time 20 --output /dev/null --write-out '%{http_code}' "$origin/en/readiness-recovery")
          if [[ "$status" != 200 ]]; then
            echo "RR_RAILWAY_WEB_HTTP=$status"
            exit 2
          fi
          echo 'RR_RAILWAY_WEB_HTTP=200'
      - name: Verify anonymous BFF enforces authentication, not missing configuration
        shell: bash
        run: |
          set -euo pipefail
          origin='https://rr-standalone-web-qa-qa.up.railway.app'
          status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "$origin/api/rr-operator/kernel/executions/nonexistent-qa-smoke")
          if [[ "$status" != 401 ]]; then
            echo "RR_RAILWAY_BFF_AUTH_GATE_HTTP=$status"
            exit 2
          fi
          echo 'RR_RAILWAY_BFF_AUTH_GATE_HTTP=401'
      - name: Verify existing Zitadel PKCE redirects back to Railway QA, not production
        shell: bash
        run: |
          set -euo pipefail
          origin='https://rr-standalone-web-qa-qa.up.railway.app'
          curl --silent --show-error --max-time 20 --dump-header /tmp/rr-qa-auth-headers \
            --output /dev/null "$origin/api/auth/login?return_to=$origin/en/readiness-recovery"
          python - <<'PY'
          from urllib.parse import urlparse, parse_qs
          headers = open('/tmp/rr-qa-auth-headers', encoding='utf-8').read().splitlines()
          status = headers[0].split()[1]
          location = next((line.partition(': ')[2].strip() for line in headers if line.lower().startswith('location: ')), '')
          assert status == '302', f'RR_RAILWAY_OIDC_LOGIN_HTTP_{status}'
          url = urlparse(location)
          assert url.scheme == 'https' and url.hostname == 'mentality-rmwj0i.eu1.zitadel.cloud', (
              'RR_RAILWAY_OIDC_ISSUER_MISMATCH'
          )
          qs = parse_qs(url.query)
          assert qs.get('redirect_uri') == [
              'https://rr-standalone-web-qa-qa.up.railway.app/api/auth/callback/zitadel'
          ], 'RR_RAILWAY_OIDC_CALLBACK_MISMATCH'
          assert qs.get('code_challenge_method') == ['S256'], 'RR_RAILWAY_PKCE_MISSING'
          print('RR_RAILWAY_OIDC_REDIRECT_AND_PKCE=PASS')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium for real Railway anonymous browser smoke
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify Railway Web UI in desktop, mobile portrait and landscape
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/rr-railway-bff-smoke
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          base = 'https://rr-standalone-web-qa-qa.up.railway.app'
          with sync_playwright() as pw:
              browser = pw.chromium.launch()
              try:
                  for width, height in ((1440, 900), (390, 844), (844, 390)):
                      page = browser.new_page(viewport={'width': width, 'height': height})
                      errors = []
                      page.on('pageerror', lambda error: errors.append(type(error).__name__))
                      response = page.goto(base + '/en/readiness-recovery', wait_until='domcontentloaded', timeout=30000)
                      assert response and response.status == 200, f'RR_RAILWAY_PAGE_HTTP_{width}x{height}'
                      assert page.locator('body').is_visible(), f'RR_RAILWAY_PAGE_BLANK_{width}x{height}'
                      assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1'), (
                          f'RR_RAILWAY_OVERFLOW_{width}x{height}'
                      )
                      assert not errors, f'RR_RAILWAY_JS_ERRORS_{width}x{height}: {len(errors)}'
                      page.screenshot(path=f'test-results/rr-railway-bff-smoke/anonymous-{width}x{height}.png', full_page=True)
                      print(f'RR_RAILWAY_ANONYMOUS_BROWSER_{width}x{height}=PASS')
                      # The QA-only owner authorization must be discoverable
                      # without Observatory admin navigation.
                      qa_home = page.goto(base + '/en', wait_until='domcontentloaded', timeout=30000)
                      assert qa_home and qa_home.status == 200, f'RR_OWNER_CTA_HOME_HTTP_{width}x{height}'
                      owner_cta = page.get_by_role('link', name='Verify RR QA organization')
                      assert owner_cta.count() == 1 and owner_cta.is_visible(), (
                          f'RR_OWNER_CTA_MISSING_{width}x{height}'
                      )
                      assert owner_cta.get_attribute('href') == '/en/admin/apps', (
                          f'RR_OWNER_CTA_WRONG_TARGET_{width}x{height}'
                      )
                      assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth + 1'), (
                          f'RR_OWNER_CTA_OVERFLOW_{width}x{height}'
                      )
                      page.screenshot(path=f'test-results/rr-railway-bff-smoke/owner-cta-{width}x{height}.png', full_page=True)
                      print(f'RR_OWNER_CTA_REAL_BROWSER_{width}x{height}=PASS')
                      page.close()
              finally:
                  browser.close()
          PY
      - name: Preserve anonymous Railway BFF screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-railway-bff-anonymous-viewport-evidence
          path: |
            test-results/rr-railway-bff-smoke/anonymous-*.png
            test-results/rr-railway-bff-smoke/owner-cta-*.png
          if-no-files-found: warn
          retention-days: 7
  rr-railway-real-zitadel-auth:
    # Existing test-user GitHub secrets; no shared admin credentials, DB, or writes.
    needs: rr-railway-web-bff-smoke
    if: github.event.repository.private == false && github.ref == 'refs/heads/feat/rr-e2e-01-standalone'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RR_BROWSER_URL: 'https://rr-standalone-web-qa-qa.up.railway.app'
      QDIP_E2E_ZITADEL_TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
      QDIP_E2E_ZITADEL_TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm existing test account credentials are bound
        shell: bash
        run: |
          set -euo pipefail
          for name in QDIP_E2E_ZITADEL_TEST_LOGIN QDIP_E2E_ZITADEL_TEST_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "RR_RAILWAY_ZITADEL_BLOCKED_MISSING=${name}"
              exit 2
            fi
          done
      - name: Real Zitadel user to Railway BFF and authorized RR read
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pytest==8.4.2 playwright==1.56.0 asyncpg==0.30.0
          python -m playwright install --with-deps chromium
          python -m pytest -q -s tests/test_rr_real_zitadel_standalone_browser.py::test_railway_real_zitadel_login_and_scoped_rr_read -ra
      - name: Preserve isolated owner-selector viewports (no user profile or tokens)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-staging-owner-viewport-evidence
          path: test-results/rr-staging-owner/owner-*.png
          if-no-files-found: warn
          retention-days: 7

  rr-standalone-browser:
    # Existing isolated QA. Railway project token is only available via
    # the protected environment; never execute on pull_request or fork code.
    if: github.event.repository.private == false && github.repository == 'qdip-ai/qdip-e2e' && github.actor == 'TarasGez' && (github.ref == 'refs/heads/feat/rr-e2e-01-standalone' || (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'))
    environment: rr-qa-provision
    concurrency:
      group: rr-postgres-private-verifier
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RR_BROWSER_URL: 'https://rr-standalone-web-qa-qa.up.railway.app'
      RR_E2E_STAGING_WRITE: '1' # RR-E2E-01 explicitly authorizes writes only to the pinned isolated Railway QA
      RR_E2E_ORGANIZATION_ID: '79320f9e-ab38-49a6-b02c-fe2b896b66aa' # verified Core staging QDIP tenant
      RR_QA_RAILWAY_TOKEN: ${{ secrets.RR_QA_RAILWAY_TOKEN }} # QA project/environment scoped; no PostgreSQL DSN in GitHub
      QDIP_E2E_ZITADEL_TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
      QDIP_E2E_ZITADEL_TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require real isolated staging bindings
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in RR_BROWSER_URL RR_E2E_STAGING_WRITE RR_E2E_ORGANIZATION_ID RR_QA_RAILWAY_TOKEN QDIP_E2E_ZITADEL_TEST_LOGIN QDIP_E2E_ZITADEL_TEST_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "RR_E2E_BLOCKED_MISSING_BINDING=${name}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 2
          fi
          if [[ "$RR_E2E_STAGING_WRITE" != '1' ]]; then
            echo 'RR_E2E_BLOCKED_STAGING_WRITE_NOT_APPROVED'
            exit 2
          fi
          case "$RR_BROWSER_URL" in
            https://observatory.qdip.ai|https://studio.qdip.ai|https://qdip.ai)
              echo 'RR_E2E_PRODUCTION_MUTATIONS_FORBIDDEN'
              exit 2 ;;
          esac
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real Chromium
        run: |
          python -m pip install pytest==8.4.2 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real RR standalone browser E2E
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_rr_real_zitadel_standalone_browser.py --basetemp=test-results/rr-standalone --junitxml=test-results/rr-standalone-report.xml -ra
      - name: Verify all six real-browser viewport images were created
        shell: bash
        run: |
          set -euo pipefail
          for mode in rr rr-result; do
            for viewport in 1440x900 390x844 844x390; do
              if [[ "$(find test-results/rr-standalone -name "${mode}-${viewport}.png" -type f | wc -l)" -ne 1 ]]; then
                echo "RR_E2E_MISSING_SCREENSHOT=${mode}-${viewport}.png"
                exit 2
              fi
            done
          done
      - name: Upload standalone RR pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-standalone-pytest-report
          path: test-results/rr-standalone-report.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Upload 6 standalone RR viewport screenshots (no authenticated trace)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rr-standalone-six-viewport-screenshots
          path: test-results/rr-standalone/**/rr-*.png
          if-no-files-found: warn
          retention-days: 7
