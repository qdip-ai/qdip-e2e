name: QDIP Independent Security Gate
run-name: Static Security Gate ${{ inputs.target || 'core' }} @ ${{ inputs.source_ref || 'a1b8baed964b0e88113253ebd3517de2d0b94610' }}

on:
  push:
    branches: [test/sdk400-core-static-security-audit-20261102]
    paths: [.github/workflows/security-gate.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/security-gate.yml]
  workflow_dispatch:
    inputs:
      target:
        description: "Allowlisted QDIP repository"
        type: choice
        required: true
        options: [vhv, core, web, doctor]
        default: vhv
      source_ref:
        description: "Source ref / 40-char SHA (use immutable SHA for release qualification)"
        type: string
        required: true
        default: dev
      expected_sha:
        description: "Optional exact 40-char source SHA; refuse a mismatched source ref"
        type: string
        required: false

# Explicit manual execution or pinned owner-only SDK400 audit branch.
# Never runs AI or installs/executes target source code.
# GitHub-hosted Actions and vulnerability DB downloads may still consume runner/network quotas.
permissions:
  contents: read

concurrency:
  group: qdip-static-security-${{ inputs.target || 'core' }}-${{ inputs.source_ref || 'a1b8baed964b0e88113253ebd3517de2d0b94610' }}
  cancel-in-progress: false

jobs:
  deterministic-audit:
    if: >-
      github.event.repository.private == false &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        github.head_ref == 'test/sdk400-core-static-security-audit-20261102'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SECURITY_TARGET: ${{ inputs.target || 'core' }}
      SOURCE_REF: ${{ inputs.source_ref || 'a1b8baed964b0e88113253ebd3517de2d0b94610' }}
      EXPECTED_SHA: ${{ inputs.expected_sha || (github.event_name != 'workflow_dispatch' && 'a1b8baed964b0e88113253ebd3517de2d0b94610') || '' }}
      SOURCE_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout public independent E2E security tooling
        uses: actions/checkout@v4
        with:
          path: suite
          persist-credentials: false

      - name: Initialize private report workspace
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "GATE_REPORT_DIR=$RUNNER_TEMP/qdip-security-private"
            echo "SANITIZED_DIR=$RUNNER_TEMP/qdip-security-public"
            echo "GATE_TOOLS_BIN=$RUNNER_TEMP/qdip-security-bin"
            echo "GATE_SEMGREP_CONFIG=$GITHUB_WORKSPACE/suite/security/semgrep.yml"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/qdip-security-private" "$RUNNER_TEMP/qdip-security-public" "$RUNNER_TEMP/qdip-security-bin"
          chmod 700 "$RUNNER_TEMP/qdip-security-private" "$RUNNER_TEMP/qdip-security-public"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate target allowlist and ref before accessing secrets
        run: node suite/scripts/security_gate.mjs validate-input

      - name: Require dedicated read-only security token
        shell: bash
        env:
          SECURITY_READ_TOKEN: ${{ secrets.QDIP_SECURITY_READ_TOKEN }}
        run: |
          if [[ -z "$SECURITY_READ_TOKEN" ]]; then
            echo "::error::QDIP_SECURITY_READ_TOKEN is not configured in qdip-e2e Actions secrets"
            exit 1
          fi

      - name: Checkout private source at requested revision, read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target == 'vhv' && 'qdip-ai/qdip-personal-secretary' || (inputs.target == 'core' || github.event_name != 'workflow_dispatch') && 'qdip-ai/qdip-core' || inputs.target == 'web' && 'qdip-ai/qdip-web' || 'qdip-ai/qdip-model-doctor' }}
          ref: ${{ inputs.source_ref || 'a1b8baed964b0e88113253ebd3517de2d0b94610' }}
          token: ${{ secrets.QDIP_SECURITY_READ_TOKEN }}
          path: target
          persist-credentials: false

      - name: Refuse stale source SHA and dirty checkout before scanning
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C target rev-parse HEAD)"
          if [[ -n "$EXPECTED_SHA" ]] && [[ "$actual" != "$EXPECTED_SHA" ]]; then
            echo "Expected SHA mismatch; refusing scan"
            exit 1
          fi
          test -z "$(git -C target status --porcelain)"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned OSS Gitleaks and Semgrep (not source packages)
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$GATE_TOOLS_BIN"
          go install github.com/zricethezav/gitleaks/v8@v8.24.3 > "$GATE_REPORT_DIR/gitleaks-install.private.log" 2>&1
          python -m venv "$RUNNER_TEMP/qdip-security-venv"
          "$RUNNER_TEMP/qdip-security-venv/bin/python" -m pip install --disable-pip-version-check --no-input semgrep==1.134.0 > "$GATE_REPORT_DIR/semgrep-install.private.log" 2>&1
          ln -s "$RUNNER_TEMP/qdip-security-venv/bin/semgrep" "$GATE_TOOLS_BIN/semgrep"
          test -x "$GATE_TOOLS_BIN/gitleaks"
          test -x "$GATE_TOOLS_BIN/semgrep"

      - name: Run Gitleaks secrets and local Semgrep SAST
        shell: bash
        run: bash suite/scripts/run_security_scans.sh

      - name: Print scanner exit metadata only (never private findings)
        shell: bash
        run: |
          set -euo pipefail
          for name in gitleaks semgrep; do
            file="$GATE_REPORT_DIR/$name.exit"
            if [[ -f "$file" ]] && [[ "$(cat "$file")" =~ ^[0-9]{1,3}$ ]]; then
              echo "SDK400_${name^^}_EXIT=$(cat "$file")"
            else
              echo "SDK400_${name^^}_EXIT=UNAVAILABLE"
            fi
            if [[ -s "$GATE_REPORT_DIR/$name.json" ]]; then
              echo "SDK400_${name^^}_REPORT_PRESENT=true"
            else
              echo "SDK400_${name^^}_REPORT_PRESENT=false"
            fi
          done

      - name: Scan dependency manifests and configuration via pinned Trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          version: 'v0.70.0'
          scan-ref: 'target'
          scanners: 'vuln,misconfig'
          format: 'json'
          output: ${{ runner.temp }}/qdip-security-private/trivy.json
          exit-code: '0'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        env:
          TRIVY_DISABLE_TELEMETRY: 'true'
          TRIVY_OFFLINE_SCAN: 'true'

      - name: Record scanner completion without leaking reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.trivy.outcome }}" == success ]] && [[ -s "$GATE_REPORT_DIR/trivy.json" ]]; then
            printf '0\n' > "$GATE_REPORT_DIR/trivy.exit"
          else
            printf '99\n' > "$GATE_REPORT_DIR/trivy.exit"
          fi

      - name: Evaluate source-bound deterministic evidence (fail closed)
        if: always()
        run: node suite/scripts/deterministic_security_gate.mjs

      - name: Upload sanitized public verdict only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qdip-deterministic-security-verdict
          path: ${{ runner.temp }}/qdip-security-public/verdict.json
          if-no-files-found: warn
          retention-days: 14
