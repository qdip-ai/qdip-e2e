name: Dzvin production QA1 QA2 authenticated read-only rollback smoke
on:
  push:
    branches: [test/dzvin-production-auth-smoke-20261102]
permissions:
  contents: read
jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      DZVIN_PRODUCTION_READONLY_ACK: '1'
      QDIP_E2E_ZITADEL_TEST1_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_LOGIN }}
      QDIP_E2E_ZITADEL_TEST1_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD }}
      QDIP_E2E_ZITADEL_TEST2_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_LOGIN }}
      QDIP_E2E_ZITADEL_TEST2_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/dzvin_qa_production_auth_readonly_20261102.mjs
      - name: Install isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dzvin-prod-auth"
          cp scripts/dzvin_qa_production_auth_readonly_20261102.mjs "$RUNNER_TEMP/dzvin-prod-auth/"
          cd "$RUNNER_TEMP/dzvin-prod-auth"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify post-rollback production authenticated BFF and logout
        shell: bash
        run: cd "$RUNNER_TEMP/dzvin-prod-auth" && node dzvin_qa_production_auth_readonly_20261102.mjs
