name: AutoDev PR 122 preview authenticated read-only E2E
# Public repository: secrets are never available to fork PRs. This workflow runs only from branches of this
# repository, uses only scripts of this repository, and never checks out or executes the PWA source.
on:
  push:
    branches:
      - test/autodev-pr122-preview-e2e
    paths:
      - scripts/autodev_pr122_preview_e2e.mjs
      - .github/workflows/autodev-pr122-preview-e2e.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autodev-pr122-preview-e2e
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check existing QA operator binding without disclosure
        env:
          LOGIN_BOUND: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN != '' }}
          PASSWORD_BOUND: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD != '' }}
        run: |
          set -euo pipefail
          node --check scripts/autodev_pr122_preview_e2e.mjs
          echo "QDIP_E2E_ZITADEL_TEST_LOGIN_BOUND=$LOGIN_BOUND"
          echo "QDIP_E2E_ZITADEL_TEST_PASSWORD_BOUND=$PASSWORD_BOUND"
          test "$LOGIN_BOUND" = true
          test "$PASSWORD_BOUND" = true
      - name: Install isolated Chromium
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pr122"
          cp scripts/autodev_pr122_preview_e2e.mjs "$RUNNER_TEMP/pr122/"
          cd "$RUNNER_TEMP/pr122"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Preview - callback registration, real login, route restoration, seven screens, three viewports, D1/D2/D3
        env:
          QDIP_E2E_ZITADEL_TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
          QDIP_E2E_ZITADEL_TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
          QDIP_E2E_AUTODEV_MODE: preview
          QDIP_E2E_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/pr122/evidence-preview
          CI: 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pr122"
          node autodev_pr122_preview_e2e.mjs
      - name: Baseline - same cold start on production (main) for the D3 comparison
        if: always()
        env:
          QDIP_E2E_ZITADEL_TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
          QDIP_E2E_ZITADEL_TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
          QDIP_E2E_AUTODEV_MODE: baseline
          QDIP_E2E_BROWSER_EVIDENCE_DIR: ${{ runner.temp }}/pr122/evidence-baseline
          CI: 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pr122"
          node autodev_pr122_preview_e2e.mjs
      - name: Metrics JSON and text-redacted layout screenshots only (no traces, HAR, cookies, tokens, page text)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodev-pr122-preview-e2e
          path: |
            ${{ runner.temp }}/pr122/evidence-preview
            ${{ runner.temp }}/pr122/evidence-baseline
          if-no-files-found: ignore
          retention-days: 3
