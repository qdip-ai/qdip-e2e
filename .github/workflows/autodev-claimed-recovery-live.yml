name: AutoDev claimed-recovery real browser E2E
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "anonymous (safe), review (read-only privileged), close-claimed (one irreversible approved close)"
        type: choice
        required: true
        default: anonymous
        options:
          - anonymous
          - review
          - close-claimed
      run_id:
        description: "Exact rr388-<20 hex> for privileged modes; must match live unresolved attempt"
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: autodev-claimed-recovery-real-browser
  cancel-in-progress: false
jobs:
  browser-e2e:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate mode and one-use operator approval before starting browser
        shell: bash
        env:
          E2E_MODE: ${{ inputs.mode }}
          E2E_RUN_ID: ${{ inputs.run_id }}
          APPROVED_RUN: ${{ secrets.QDIP_E2E_AUTODEV_NO_CHARGE_RUN }}
          APPROVED_FLAG: ${{ secrets.QDIP_E2E_AUTODEV_ALLOW_CLAIMED_CLOSE }}
          CLOSER_LOGIN: ${{ secrets.QDIP_E2E_AUTODEV_STAGE_CLOSER_LOGIN }}
          CLOSER_PASSWORD: ${{ secrets.QDIP_E2E_AUTODEV_STAGE_CLOSER_PASSWORD }}
        run: |
          set -euo pipefail
          case "$E2E_MODE" in
            anonymous) echo 'AUTODEV_RECOVERY_ANONYMOUS_GATE=READY' ;;
            review|close-claimed)
              [[ "$E2E_RUN_ID" =~ ^rr388-[0-9a-f]{20}$ ]]
              test -n "$CLOSER_LOGIN"
              test -n "$CLOSER_PASSWORD"
              if [ "$E2E_MODE" = close-claimed ]; then
                test "$APPROVED_FLAG" = true
                test "$APPROVED_RUN" = "$E2E_RUN_ID"
              fi
              echo 'AUTODEV_RECOVERY_PRIVILEGED_GATE=READY'
              ;;
            *) exit 2 ;;
          esac
      - name: Validate browser test source
        run: node --check scripts/autodev_claimed_recovery_live.mjs
      - name: Install isolated Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/autodev-recovery"
          cp scripts/autodev_claimed_recovery_live.mjs "$RUNNER_TEMP/autodev-recovery/"
          cd "$RUNNER_TEMP/autodev-recovery"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute real browser against staging (no mocked auth or backend)
        shell: bash
        env:
          QDIP_AUTODEV_RECOVERY_MODE: ${{ inputs.mode }}
          QDIP_AUTODEV_RECOVERY_RUN_ID: ${{ inputs.run_id }}
          QDIP_AUTODEV_CLOSER_LOGIN: ${{ secrets.QDIP_E2E_AUTODEV_STAGE_CLOSER_LOGIN }}
          QDIP_AUTODEV_CLOSER_PASSWORD: ${{ secrets.QDIP_E2E_AUTODEV_STAGE_CLOSER_PASSWORD }}
          QDIP_AUTODEV_NO_CHARGE_CONFIRMED_RUN: ${{ secrets.QDIP_E2E_AUTODEV_NO_CHARGE_RUN }}
          QDIP_AUTODEV_APPROVE_CLOSURE: ${{ secrets.QDIP_E2E_AUTODEV_ALLOW_CLAIMED_CLOSE }}
          CI: 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/autodev-recovery"
          node autodev_claimed_recovery_live.mjs
