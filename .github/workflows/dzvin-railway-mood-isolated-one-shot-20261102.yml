name: Dzvin isolated Railway Mongo real QA1 QA2 mood E2E
on:
  push:
    branches:
      - test/dzvin-railway-isolated-real-zitadel-20261102
permissions:
  contents: read
concurrency:
  group: dzvin-railway-isolated-mood-20261102
  cancel-in-progress: false
jobs:
  isolated-mood:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      DZVIN_ISOLATED_QA_APPROVED: '1'
      DZVIN_ISOLATED_QA_API: https://dzvin-b2c-rc-build-qa.up.railway.app
      QDIP_E2E_ZITADEL_TEST1_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_LOGIN }}
      QDIP_E2E_ZITADEL_TEST1_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD }}
      QDIP_E2E_ZITADEL_TEST2_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_LOGIN }}
      QDIP_E2E_ZITADEL_TEST2_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST2_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/dzvin_real_zitadel_isolated_mood_20261102.mjs
      - name: Install isolated Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dzvin-isolated-mood"
          cp scripts/dzvin_real_zitadel_isolated_mood_20261102.mjs "$RUNNER_TEMP/dzvin-isolated-mood/"
          cd "$RUNNER_TEMP/dzvin-isolated-mood"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.57.0
          npx playwright install --with-deps chromium
      - name: Protected QA1/QA2 mood create read history foreign isolation
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dzvin-isolated-mood"
          node dzvin_real_zitadel_isolated_mood_20261102.mjs
