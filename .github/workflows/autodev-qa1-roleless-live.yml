name: AutoDev QA1 real Zitadel no-operator E2E
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autodev-qa1-roleless-live
  cancel-in-progress: false
jobs:
  qa1-negative-operator:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check existing test identity without logging credentials
        env:
          TEST1_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_LOGIN }}
          TEST1_PASSWORD_EXISTS: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${TEST1_LOGIN,,}" = "qa1@qdip.ai"
          test "$TEST1_PASSWORD_EXISTS" = "true"
          echo 'AUTODEV_QA1_EXISTING_TEST_ACCOUNT=BOUND'
      - name: Check E2E script syntax
        run: node --check scripts/autodev_qa1_roleless_live.mjs
      - name: Install isolated Playwright Chromium
        run: |
          set -euo pipefail
          mkdir -p /tmp/autodev-qa1
          cp scripts/autodev_qa1_roleless_live.mjs /tmp/autodev-qa1/
          cd /tmp/autodev-qa1
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Real QA1 login to AutoDev and 403 on live Control API
        env:
          QDIP_AUTODEV_QA1_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD }}
          CI: 'true'
        run: |
          set -euo pipefail
          cd /tmp/autodev-qa1
          node autodev_qa1_roleless_live.mjs
