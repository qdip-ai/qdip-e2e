name: Yara centralized real-browser E2E

# Public qdip-e2e runner only. Private Yara repository never runs GitHub Actions.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/yara-browser-e2e.yml'
      - 'yara/**'
      - 'scripts/yara-browser-gate.mjs'
      - 'scripts/yara-browser-report.mjs'
      - 'tests/yara_browser_contract.test.mjs'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      yara_sha:
        description: "Expected immutable 40-character Yara candidate SHA (only validated against a full QA deployment)"
        type: string
        required: true
      target_url:
        description: "Real Yara target URL (public smoke may use production; full requires isolated exact-SHA QA)"
        type: string
        required: true
        default: https://yara.qdip.ai
      scope:
        description: "public is an unauthenticated smoke only; full requires live Zitadel and deployed SHA attestation"
        type: choice
        required: true
        default: public
        options:
          - public
          - full

permissions:
  contents: read

concurrency:
  group: qdip-yara-browser-e2e
  cancel-in-progress: false

jobs:
  yara-browser:
    if: >-
      github.event.repository.private == false &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
       (github.event_name == 'issue_comment' && github.event.issue.number == 101 &&
        github.event.comment.user.login == 'TarasGez' &&
        startsWith(github.event.comment.body, '/yara-e2e public ')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      YARA_E2E_BASE_URL: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 104 && 'https://yara-qa-web-sandbox.up.railway.app' || inputs.target_url || 'https://yara.qdip.ai' }}
      YARA_E2E_EXPECTED_SHA: ${{ inputs.yara_sha || '' }}
      YARA_E2E_SCOPE: ${{ inputs.scope || 'public' }}
    steps:
      - name: Checkout independent qdip-e2e suite
        uses: actions/checkout@v4
        with:
          path: suite
          persist-credentials: false

      - name: Parse authorized one-command smoke request
        if: github.event_name == 'issue_comment'
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          node -e 'const fs=require("node:fs");const m=/^\/yara-e2e public ([0-9a-f]{40})$/.exec(process.env.COMMENT_BODY.trim());if(!m)process.exit(1);fs.appendFileSync(process.env.GITHUB_ENV,"YARA_E2E_EXPECTED_SHA="+m[1]+"\n")'

      - name: Verify input syntax and isolated full-test target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$YARA_E2E_SCOPE" == 'full' || -n "$YARA_E2E_EXPECTED_SHA" ]]; then
            [[ "$YARA_E2E_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'YARA_SOURCE_SHA_INVALID'; exit 1; }
          fi
          node suite/scripts/yara-browser-gate.mjs validate
          if [[ "${{ github.event_name }}" == 'pull_request' && "${{ github.event.pull_request.number }}" == '104' ]]; then
            curl --fail --silent --show-error --max-time 15 "$YARA_E2E_BASE_URL/api/build-identity" | node -e 'let s="";process.stdin.on("data",x=>s+=x).on("end",()=>{let v;try{v=JSON.parse(s)}catch{} if(v?.sha!=="d98eeb373ab8cd4f7e2cae13b00478f56eab5554")process.exit(1);console.log("YARA_QA_DEPLOYED_SHA=PASS")})'
          fi

      - name: Validate centralized browser contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check suite/scripts/yara-browser-gate.mjs
          node --check suite/scripts/yara-browser-report.mjs
          node --check suite/yara/playwright.config.cjs
          node --check suite/yara/tests/e2e/yara-browser.spec.cjs
          echo 'YARA_PRIVATE_SOURCE_CHECKOUT=NOT_REQUIRED'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned centralized Yara browser tests
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/yara-suite"
          mkdir -p "$target/tests/e2e"
          cp suite/yara/playwright.config.cjs "$target/playwright.config.cjs"
          cp suite/yara/tests/e2e/yara-browser.spec.cjs "$target/tests/e2e/yara-browser.spec.cjs"
          cd "$target"
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.57.0

      - name: Install real Chromium and WebKit
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/yara-suite"
          ./node_modules/.bin/playwright install --with-deps chromium webkit

      - name: Check real QA deploy source SHA before authenticated testing
        if: inputs.scope == 'full'
        run: node suite/scripts/yara-browser-gate.mjs attest

      - name: Validate existing encrypted Zitadel test identity
        if: inputs.scope == 'full'
        env:
          QDIP_E2E_ZITADEL_TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
          QDIP_E2E_ZITADEL_TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$QDIP_E2E_ZITADEL_TEST_LOGIN"
          test -n "$QDIP_E2E_ZITADEL_TEST_PASSWORD"

      - name: Create private QA session via genuine Zitadel browser login
        if: inputs.scope == 'full'
        env:
          QDIP_E2E_ZITADEL_TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
          QDIP_E2E_ZITADEL_TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
          YARA_E2E_RUNNER_DIR: ${{ runner.temp }}/yara-suite
          YARA_E2E_QA_STATE_FILE: ${{ runner.temp }}/yara-qa-storage-state.json
        run: node suite/scripts/yara-browser-gate.mjs login

      - name: Real browser smoke / authenticated read-only matrix
        shell: bash
        env:
          YARA_E2E_QA_CONFIRMED: ${{ inputs.scope == 'full' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "$YARA_E2E_SCOPE" == 'full' ]]; then
            export YARA_E2E_QA_STATE_FILE="$RUNNER_TEMP/yara-qa-storage-state.json"
          fi
          cd "$RUNNER_TEMP/yara-suite"
          set +e
          if [[ "$YARA_E2E_SCOPE" == 'public' ]]; then
            ./node_modules/.bin/playwright test --grep '@public' --reporter=json > "$RUNNER_TEMP/yara-playwright.json" 2> "$RUNNER_TEMP/yara-playwright.stderr"
          else
            ./node_modules/.bin/playwright test --reporter=json > "$RUNNER_TEMP/yara-playwright.json" 2> "$RUNNER_TEMP/yara-playwright.stderr"
          fi
          browser_exit=$?
          set -e
          node "$GITHUB_WORKSPACE/suite/scripts/yara-browser-report.mjs" "$RUNNER_TEMP/yara-playwright.json" "$YARA_E2E_SCOPE"
          test "$browser_exit" -eq 0

      - name: Upload public login screenshots only
        if: success() && env.YARA_E2E_SCOPE == 'public'
        uses: actions/upload-artifact@v4
        with:
          name: yara-public-login-browser-evidence
          path: ${{ runner.temp }}/yara-suite/test-results/**/login.png
          if-no-files-found: error
          retention-days: 7

      - name: Preserve confidentiality and evidence boundary
        if: always()
        run: |
          echo 'YARA_FULL_SCREENSHOTS_PUBLIC_ARTIFACT=FORBIDDEN'
          echo 'YARA_AUTH_SESSION_AND_RAW_LOGS=EPHEMERAL_RUNNER_ONLY'
          if [[ "$YARA_E2E_SCOPE" == 'public' ]]; then
            echo 'YARA_CANDIDATE_SHA_BROWSER_QUALIFICATION=NOT_TESTED'
          else
            echo 'YARA_NATIVE_SAFARI=NOT_TESTED (Linux WebKit only)'
          fi
