name: MCP01 real Native QA ownership bootstrap
on:
  push:
    branches: [test/mcp01-native-token-contract]
    paths:
      - .github/workflows/mcp01-native-token.yml
      - scripts/mcp01_native_token_live.mjs
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/mcp01-native-token.yml
      - scripts/mcp01_native_token_live.mjs
permissions:
  contents: read
concurrency:
  group: mcp01-native-token-contract
  cancel-in-progress: false
jobs:
  token-contract:
    if: github.repository == 'qdip-ai/qdip-e2e' && github.event_name == 'push' && github.ref == 'refs/heads/test/mcp01-native-token-contract' && !contains(github.event.head_commit.message, '[MCP-QA:')
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated pinned browser dependencies without QA credentials
        run: |
          set -euo pipefail
          mkdir -p /tmp/mcp01-native
          cp scripts/mcp01_native_token_live.mjs /tmp/mcp01-native/
          cd /tmp/mcp01-native
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1 jose@6.1.3 @modelcontextprotocol/client@2.4.0
          # Hosted Ubuntu24.04 already supplies the runtime libraries; real browser launch is the hard check.
          npx playwright install chromium
          node --check mcp01_native_token_live.mjs
          node mcp01_native_token_live.mjs --self-test
      - name: Verify real Zitadel owner and canonical Core QA link
        env:
          MCP01_PROVISION_OAUTH: "false"
          MCP01_VERIFY_EXISTING_OAUTH: "false"
          MCP01_CONFIGURE_ROLE_CONTRACT: "false"
          MCP01_OAUTH_PROFILE: zitadel_project_roles
          MCP01_REGISTER_QA_CALLBACK: "false"
          QDIP_E2E_ZITADEL_TEST21_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_LOGIN }}
          QDIP_E2E_ZITADEL_TEST21_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_PASSWORD }}
          QDIP_SDK_QA_PROJECT_ID: ${{ vars.QDIP_SDK_QA_PROJECT_ID }}
          QDIP_SDK_MANAGED_APP_ID: ${{ vars.QDIP_SDK_MANAGED_APP_ID }}
          QDIP_SDK_MANAGED_CLIENT_ID: ${{ vars.QDIP_SDK_MANAGED_CLIENT_ID }}
        run: |
          set -euo pipefail
          cd /tmp/mcp01-native
          node mcp01_native_token_live.mjs --mcp-owner-bootstrap
      - name: Check existing isolated QA Core operator credential channel (no value read)
        env:
          QA_CORE_OPERATOR_PRESENT: ${{ secrets.MCP652_QA_PLATFORM_ADMIN_API_KEY != '' }}
          LEGACY_CORE_OPERATOR_PRESENT: ${{ secrets.QDIP_PLATFORM_ADMIN_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ "$QA_CORE_OPERATOR_PRESENT" == true ]]; then
            echo 'MCP_QA_CORE_ADMIN_CHANNEL=AVAILABLE'
          elif [[ "$LEGACY_CORE_OPERATOR_PRESENT" == true ]]; then
            echo 'MCP_QA_CORE_ADMIN_CHANNEL=LEGACY_ONLY_UNVERIFIED_SCOPE'
          else
            echo 'MCP_QA_CORE_ADMIN_CHANNEL=NOT_CONFIGURED'
          fi
      - name: Verify existing MCP Railway sealed custody (read-only)
        env:
          MCP01_PROVISION_OAUTH: "false"
          MCP01_VERIFY_EXISTING_OAUTH: "true"
          MCP01_CONFIGURE_ROLE_CONTRACT: "false"
          MCP01_OAUTH_PROFILE: zitadel_project_roles
          MCP01_REGISTER_QA_CALLBACK: "false"
          RAILWAY_MCP_QA_PROJECT_TOKEN: ${{ secrets.RAILWAY_MCP_QA_PROJECT_TOKEN }}
          QDIP_E2E_ZITADEL_TEST21_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_LOGIN }}
          QDIP_E2E_ZITADEL_TEST21_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_PASSWORD }}
          QDIP_SDK_QA_PROJECT_ID: ${{ vars.QDIP_SDK_QA_PROJECT_ID }}
          QDIP_SDK_MANAGED_APP_ID: ${{ vars.QDIP_SDK_MANAGED_APP_ID }}
          QDIP_SDK_MANAGED_CLIENT_ID: ${{ vars.QDIP_SDK_MANAGED_CLIENT_ID }}
        run: |
          set -euo pipefail
          cd /tmp/mcp01-native
          node mcp01_native_token_live.mjs
      - name: Verify canonical QA Application binding with real PROJECT_OWNER
        env:
          MCP01_PROVISION_OAUTH: "false"
          MCP01_VERIFY_EXISTING_OAUTH: "false"
          MCP01_CONFIGURE_ROLE_CONTRACT: "false"
          MCP01_OAUTH_PROFILE: zitadel_project_roles
          MCP01_REGISTER_QA_CALLBACK: "false"
          QDIP_E2E_ZITADEL_TEST21_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_LOGIN }}
          QDIP_E2E_ZITADEL_TEST21_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_PASSWORD }}
          QDIP_SDK_QA_PROJECT_ID: ${{ vars.QDIP_SDK_QA_PROJECT_ID }}
          QDIP_SDK_MANAGED_APP_ID: ${{ vars.QDIP_SDK_MANAGED_APP_ID }}
          QDIP_SDK_MANAGED_CLIENT_ID: ${{ vars.QDIP_SDK_MANAGED_CLIENT_ID }}
        run: |
          set -euo pipefail
          cd /tmp/mcp01-native
          node mcp01_native_token_live.mjs --mcp-application-link
      - name: Independent cross-organization account denial (read-only)
        env:
          CI: 'true'
          QDIP_E2E_ZITADEL_TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
          QDIP_E2E_ZITADEL_TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          cp scripts/zitadel_qa21_reverse_org_live.mjs /tmp/mcp01-native/
          cd /tmp/mcp01-native
          node --check zitadel_qa21_reverse_org_live.mjs
          node zitadel_qa21_reverse_org_live.mjs
      - name: Execute real MCP list, describe and Kernel invoke (no provisioning)
        env:
          MCP01_PROVISION_OAUTH: "false"
          MCP01_VERIFY_EXISTING_OAUTH: "false"
          MCP01_CONFIGURE_ROLE_CONTRACT: "false"
          MCP01_OAUTH_PROFILE: zitadel_project_roles
          MCP01_REGISTER_QA_CALLBACK: "false"
          QDIP_E2E_ZITADEL_TEST21_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_LOGIN }}
          QDIP_E2E_ZITADEL_TEST21_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_PASSWORD }}
          QDIP_SDK_QA_PROJECT_ID: ${{ vars.QDIP_SDK_QA_PROJECT_ID }}
          QDIP_SDK_MANAGED_APP_ID: ${{ vars.QDIP_SDK_MANAGED_APP_ID }}
          QDIP_SDK_MANAGED_CLIENT_ID: ${{ vars.QDIP_SDK_MANAGED_CLIENT_ID }}
        run: |
          set -euo pipefail
          cd /tmp/mcp01-native
          node mcp01_native_token_live.mjs --mcp-execution
  qa-worker-fault:
    if: github.repository == 'qdip-ai/qdip-e2e' && github.event_name == 'pull_request' && github.head_ref == 'test/mcp01-native-token-contract'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned independent MCP client and real Chromium
        run: |
          set -euo pipefail
          mkdir -p /tmp/mcp01-native
          cp scripts/mcp01_native_token_live.mjs /tmp/mcp01-native/
          cd /tmp/mcp01-native
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1 jose@6.1.3 @modelcontextprotocol/client@2.4.0
          npx playwright install chromium
          node --check mcp01_native_token_live.mjs
      - name: Assert live QA Worker fault outcome (no provisioning or OAuth requalification)
        env:
          MCP01_PROVISION_OAUTH: "false"
          MCP01_VERIFY_EXISTING_OAUTH: "false"
          MCP01_CONFIGURE_ROLE_CONTRACT: "false"
          MCP01_OAUTH_PROFILE: zitadel_project_roles
          MCP01_REGISTER_QA_CALLBACK: "false"
          QDIP_E2E_ZITADEL_TEST21_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_LOGIN }}
          QDIP_E2E_ZITADEL_TEST21_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST21_PASSWORD }}
          QDIP_SDK_QA_PROJECT_ID: ${{ vars.QDIP_SDK_QA_PROJECT_ID }}
          QDIP_SDK_MANAGED_APP_ID: ${{ vars.QDIP_SDK_MANAGED_APP_ID }}
          QDIP_SDK_MANAGED_CLIENT_ID: ${{ vars.QDIP_SDK_MANAGED_CLIENT_ID }}
        run: |
          set -euo pipefail
          cd /tmp/mcp01-native
          node mcp01_native_token_live.mjs --mcp-worker-timeout
