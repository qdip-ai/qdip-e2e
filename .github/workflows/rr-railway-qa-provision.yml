name: Provision existing RR Railway QA credentials
on:
  # The pre-merge workflow exists only on the dedicated RR branch. Restrict
  # credential-bearing pushes to changes of THIS workflow by the repo owner.
  push:
    branches: [feat/rr-e2e-01-standalone]
    paths: [.github/workflows/rr-railway-qa-provision.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provision:
    if: github.repository == 'qdip-ai/qdip-e2e' && github.event.repository.private == false && github.actor == 'TarasGez' && (github.ref == 'refs/heads/feat/rr-e2e-01-standalone' || (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    environment: rr-qa-provision
    concurrency:
      group: rr-qa-scoped-provisioning
      cancel-in-progress: false
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect existing credential channels without disclosing values
        env:
          QA_PROJECT: ${{ secrets.RR_QA_RAILWAY_TOKEN != '' }}
          RAILWAY_PROJECT: ${{ secrets.RAILWAY_PROJECT_TOKEN != '' }}
          RAILWAY_ACCOUNT: ${{ secrets.RAILWAY_TOKEN != '' }}
          RAILWAY_API: ${{ secrets.RAILWAY_API_TOKEN != '' }}
          QA_CORE_ADMIN: ${{ secrets.MCP652_QA_PLATFORM_ADMIN_API_KEY != '' }}
          CORE_ADMIN: ${{ secrets.QDIP_PLATFORM_ADMIN_API_KEY != '' }}
          RR_BROWSER_KEY: ${{ secrets.RR_QA_ORG_API_KEY != '' }}
          RR_SCHEDULING_KEY: ${{ secrets.RR_QA_S2S_API_KEY != '' }}
          RR_ECONOMIC_KEY: ${{ secrets.RR_QA_ECONOMIC_API_KEY != '' }}
          QA_OWNER_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN != '' }}
          QA_OWNER_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD != '' }}
        run: |
          set -euo pipefail
          for name in QA_PROJECT RAILWAY_PROJECT RAILWAY_ACCOUNT RAILWAY_API QA_CORE_ADMIN CORE_ADMIN RR_BROWSER_KEY RR_SCHEDULING_KEY RR_ECONOMIC_KEY QA_OWNER_LOGIN QA_OWNER_PASSWORD; do
            printf 'RR_EXISTING_CHANNEL_%s=%s\n' "$name" "${!name}"
          done
      - name: Provision only the existing Railway RR QA service
        env:
          RR_QA_PROVISION_APPROVED: ${{ vars.RR_QA_PROVISION_APPROVED }}
          RR_QA_RAILWAY_TOKEN: ${{ secrets.RR_QA_RAILWAY_TOKEN }}
          RR_QA_ORGANIZATION_ID: '79320f9e-ab38-49a6-b02c-fe2b896b66aa'
          RR_QA_ORG_API_KEY: ${{ secrets.RR_QA_ORG_API_KEY }}
          RR_QA_S2S_API_KEY: ${{ secrets.RR_QA_S2S_API_KEY }}
          RR_QA_ECONOMIC_API_KEY: ${{ secrets.RR_QA_ECONOMIC_API_KEY }}
          RR_QA_SCHEDULING_GATEWAY_URL: ${{ vars.RR_QA_SCHEDULING_GATEWAY_URL }}
          RR_QA_ECONOMIC_GATEWAY_URL: ${{ vars.RR_QA_ECONOMIC_GATEWAY_URL }}
        run: python scripts/provision_rr_railway_qa.py
